[project]
name = "hdmi"
dynamic = ["version"]
description = "A dependency injection framework for Python with dynamic late-binding resolution"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Romain Dorgueil", email = "romain@makersquad.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/msqd/hdmi"
Documentation = "https://python-hdmi.readthedocs.io/"
Repository = "https://github.com/msqd/hdmi"
Issues = "https://github.com/msqd/hdmi/issues"
Changelog = "https://github.com/msqd/hdmi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "basedpyright>=1.21.0",
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.0.0",
    "furo>=2024.0.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "twine>=6.0.0",
    "hatch>=1.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hdmi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hdmi"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
# Standard type checking mode - stricter than basic, not as strict as strict
typeCheckingMode = "standard"
pythonVersion = "3.13"

# Include source code and tests
include = ["src", "tests"]

# Report missing type stubs for third-party libraries as information, not errors
reportMissingTypeStubs = "information"

# Note: Planning to migrate to Astral's 'ty' when it reaches production readiness (late 2025)
# https://github.com/astral-sh/ty
